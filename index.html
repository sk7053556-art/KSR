<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSR VIDEO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff0000">
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial}
header{padding:12px;background:#000;display:flex;align-items:center}
.logo{font-weight:bold;font-size:20px}
.logo span{color:red}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#1e1e1e;border-radius:10px;overflow:hidden}
.thumb{aspect-ratio:16/9;position:relative;background:#333}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:30px}
.info{padding:8px}.title{font-weight:600;font-size:14px}
#watch{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:10}
.player{aspect-ratio:16/9;width:100%}
</style>
</head>
<body>
<header><div class="logo">KSR<span>VIDEO</span></div></header>
<div class="grid" id="grid"></div>
<div id="watch"><div class="player" id="player"></div><button onclick="document.getElementById('watch').style.display='none'" style="margin:10px;padding:10px">Back</button></div>
<script>
let videos=[{id:"D5bN_lMW2nc",title:"मेरा वीडियो 1"},{id:"D5bN_lMW2nc",title:"मेरा वीडियो 2"}];
function render(){document.getElementById('grid').innerHTML=videos.map(v=>`<div class="card" onclick="openW('${v.id}','${v.title}')"><div class="thumb"><div class="play">▶</div></div><div class="info"><div class="title">${v.title}</div></div></div>`).join('')}
function openW(id,title){document.getElementById('watch').style.display='block';document.getElementById('player').innerHTML=`<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1" frameborder="0" allowfullscreen></iframe>`}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
